name: 'Run R Analysis'

permissions: read-all

on:
  push:

jobs:
  run-analysis:
    # timeout-minutes: 30    

    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # cache-version: 2  # invalidates cache
          packages: |
            any::devtools
            any::tidyverse
            any::tinyplot
            any::sf
            any::bruneimap
            any::tidytext
            any::tm
            any::wordcloud
            any::gt
            any::gtsummary
            any::scales
            any::mvtnorm
            any::titanic
            any::ggthemes
            any::viridis
            any::ggrepel
            any::RColorBrewer
            github::haleyjeppson/ggmosaic

      - name: Run analysis script
        working-directory: R
        run: Rscript analysis.R
